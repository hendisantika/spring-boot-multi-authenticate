# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Gradle dependencies, plugins and the Gradle wrapper
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    groups:
      # Spring Boot plugin + Spring dependency management move together
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring.dependency-management*"
        update-types:
          - minor
          - patch
      # Test-only libraries
      test:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
        update-types:
          - minor
          - patch
      # Everything else: bundle minor/patch bumps into one PR to cut noise
      gradle-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework*"
          - "io.spring.dependency-management*"
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
        update-types:
          - minor
          - patch

  # GitHub Actions used by workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
